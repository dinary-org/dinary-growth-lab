[project]
name = "dinary-growth-lab"
version = "0.1.0"
description = "Autonomous, evidence-based short-form trend research and original video production engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "Pillow>=10",
]

[project.optional-dependencies]
cloud = ["boto3>=1.34", "anthropic>=0.70"]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
dgl = "dgl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
